<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hunter Help — Acesso</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #070808;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(245, 166, 35, 0.13),
                    transparent 38%
                ),
                #070808;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #101212;
            border: 1px solid #272929;
            border-radius: 20px;
            padding: 42px;
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 255, 255, 0.015);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 46px;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #f5a623;
            color: #090a0a;

            border-radius: 12px;

            font-size: 22px;
            font-weight: 900;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: #777b7b;
            font-size: 11px;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 12px;

            color: #f5a623;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.7px;
        }

        h1 {
            font-size: 34px;
            line-height: 1.05;
            letter-spacing: -1.4px;
            margin-bottom: 14px;
        }

        .description {
            color: #888d8d;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;

            color: #d8dada;

            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 15px;

            background: #090a0a;
            border: 1px solid #303333;
            border-radius: 10px;

            outline: none;

            color: #ffffff;
            font-size: 14px;

            transition: 0.2s ease;
        }

        input::placeholder {
            color: #4e5353;
        }

        input:focus {
            border-color: #f5a623;

            box-shadow:
                0 0 0 3px rgba(245, 166, 35, 0.08);
        }

        .help {
            display: block;
            margin-top: 8px;

            color: #5f6464;
            font-size: 11px;
        }

        button {
            width: 100%;
            height: 52px;

            border: 0;
            border-radius: 10px;

            background: #f5a623;
            color: #090a0a;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;
        }

        button:hover {
            background: #ffb83f;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px 14px;

            border-radius: 9px;

            font-size: 13px;
            line-height: 1.4;
        }

        .message.error {
            color: #ff8989;
            background: rgba(255, 70, 70, 0.08);
            border: 1px solid rgba(255, 70, 70, 0.18);
        }

        .message.success {
            color: #79d99a;
            background: rgba(70, 190, 110, 0.08);
            border: 1px solid rgba(70, 190, 110, 0.18);
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            margin-top: 30px;

            color: #555a5a;
            font-size: 10px;
        }

        .dot {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #55c77a;

            box-shadow:
                0 0 9px rgba(85, 199, 122, 0.6);
        }

        @media (max-width: 520px) {

            .login-page {
                padding: 16px;
            }

            .login-card {
                padding: 30px 24px;
                border-radius: 16px;
            }

            h1 {
                font-size: 29px;
            }

            .brand {
                margin-bottom: 38px;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">

                <div class="brand-logo">
                    H
                </div>

                <div>
                    <div class="brand-name">
                        Hunter Help
                    </div>

                    <div class="brand-subtitle">
                        Inteligência comercial
                    </div>
                </div>

            </div>

            <span class="eyebrow">
                ÁREA DA IMOBILIÁRIA
            </span>

            <h1>
                Bem-vindo de volta.
            </h1>

            <p class="description">
                Acesse o Hunter Help e descubra onde sua
                imobiliária pode melhorar, captar mais leads
                e vender mais.
            </p>

            <form id="loginForm">

                <div class="field">

                    <label for="agencyKey">
                        Chave de acesso
                    </label>

                    <input
                        type="text"
                        id="agencyKey"
                        placeholder="HUNTER-DEMO-001"
                        autocomplete="off"
                        required
                    >

                    <span class="help">
                        A chave foi fornecida pelo Hunter Help.
                    </span>

                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Entrar no Hunter Help
                </button>

                <div
                    id="message"
                    class="message"
                    hidden
                ></div>

            </form>

            <div class="footer">

                <span>Ambiente protegido</span>

                <span class="dot"></span>

                <span>Hunter Help</span>

            </div>

        </section>

    </main>


    <script>

        const API_URL = "https://hunter-help-api.onrender.com/";

        const form = document.getElementById("loginForm");
        const input = document.getElementById("agencyKey");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const key = input.value.trim();

            if (!key) {
                showMessage(
                    "Digite sua chave de acesso.",
                    "error"
                );

                return;
            }

            button.disabled = true;
            button.textContent = "Verificando...";

            message.hidden = true;


            try {

                const response = await fetch(
                    `${API_URL}/api/auth/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            key: key
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message || "Chave inválida."
                    );

                }


                localStorage.setItem(
                    "hunter_token",
                    data.token
                );


                localStorage.setItem(
                    "hunter_agency",
                    JSON.stringify(data.agency)
                );


                showMessage(
                    "Acesso autorizado. Entrando...",
                    "success"
                );


                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 700);


            } catch (error) {

                showMessage(
                    error.message ||
                    "Não foi possível conectar ao Hunter Help.",
                    "error"
                );

                button.disabled = false;
                button.textContent =
                    "Entrar no Hunter Help";

            }

        });


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

            message.hidden = false;

        }

    </script>

</body>
</html>
