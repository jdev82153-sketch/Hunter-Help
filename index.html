<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hunter Help — Acesso</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0a0a0b;
            color: #f5f5f5;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-page {
            width: 100%;
            max-width: 420px;
        }

        /* LOGO */

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-box {
            width: 64px;
            height: 64px;

            border-radius: 16px;
            overflow: hidden;

            background: #111113;
            border: 1px solid #29292c;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 15px;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand h1 {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand p {
            margin-top: 5px;
            color: #707075;
            font-size: 12px;
        }

        /* CARD */

        .login-card {
            background: #121214;
            border: 1px solid #27272a;
            border-radius: 18px;

            padding: 30px;

            box-shadow: 0 25px 70px rgba(0, 0, 0, .35);
        }

        .login-card h2 {
            font-size: 20px;
            font-weight: 650;
            margin-bottom: 7px;
        }

        .description {
            color: #77777d;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* INPUT */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #b6b6ba;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .6px;
        }

        input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #303034;
            border-radius: 10px;

            outline: none;

            background: #0c0c0e;
            color: #fff;

            font-size: 13px;

            transition: .2s;
        }

        input::placeholder {
            color: #4f4f54;
        }

        input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, .08);
        }

        /* BUTTON */

        .login-button {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 10px;

            background: #f59e0b;
            color: #111;

            font-size: 13px;
            font-weight: 750;

            cursor: pointer;

            transition: .2s;
        }

        .login-button:hover {
            background: #ffb52e;
            transform: translateY(-1px);
        }

        .login-button:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        /* MENSAGEM */

        .message {
            display: none;

            margin-top: 15px;
            padding: 11px 13px;

            border-radius: 9px;

            font-size: 11px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #fca5a5;
            background: rgba(220, 38, 38, .08);
            border: 1px solid rgba(220, 38, 38, .25);
        }

        .message.success {
            display: block;
            color: #86efac;
            background: rgba(34, 197, 94, .08);
            border: 1px solid rgba(34, 197, 94, .22);
        }

        .footer {
            text-align: center;
            margin-top: 22px;

            color: #4f4f54;
            font-size: 10px;
        }

        .footer span {
            color: #f59e0b;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 20px;
            }

            .logo-box {
                width: 58px;
                height: 58px;
            }
        }
    </style>
</head>


<body>

    <main class="login-page">

        <div class="brand">

            <div class="logo-box">

                <img
                    src="frontend/A8E0C9E9-E5F9-4B9A-8293-FE6E0E764BB6.png"
                    alt="Hunter Help"
                >

            </div>

            <h1>Hunter Help</h1>

            <p>
                Inteligência comercial para imobiliárias
            </p>

        </div>


        <section class="login-card">

            <h2>Acessar plataforma</h2>

            <p class="description">
                Entre com a chave de acesso da sua imobiliária
                para acessar o Hunter Help.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="key">
                        CHAVE DE ACESSO
                    </label>

                    <input
                        type="text"
                        id="key"
                        placeholder="Digite sua chave de acesso"
                        autocomplete="off"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Entrar na plataforma
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>

        </section>


        <div class="footer">
            Hunter Help <span>•</span> Inteligência comercial
        </div>

    </main>


    <script>

        const API_URL =
            "https://hunter-help-api.onrender.com";


        const form =
            document.getElementById("loginForm");

        const input =
            document.getElementById("key");

        const button =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            const key =
                input.value.trim();


            if (!key) {

                showMessage(
                    "Digite a chave de acesso.",
                    "error"
                );

                return;
            }


            button.disabled = true;

            button.textContent =
                "Verificando acesso...";

            message.className =
                "message";


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/auth/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                key: key
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "Chave inválida."
                    );

                }


                localStorage.setItem(
                    "hunter_token",
                    data.token
                );


                localStorage.setItem(
                    "hunter_agency",
                    JSON.stringify(data.agency)
                );


                showMessage(
                    "Acesso autorizado. Entrando...",
                    "success"
                );


                setTimeout(() => {

                    window.location.href =
                        "frontend/dashboard.html";

                }, 500);


            } catch (error) {

                showMessage(
                    error.message ||
                    "Não foi possível conectar ao servidor.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Entrar na plataforma";
            }

        });

    </script>

</body>

</html>
