<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hunter Help — Inteligência Comercial</title>

    <meta
        name="description"
        content="Hunter Help — inteligência comercial para imobiliárias."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080808;
            --card: #111111;
            --border: #292929;
            --text: #f5f5f5;
            --muted: #8b8b8b;
            --orange: #ff6a00;
            --orange-dark: #db5600;
            --green: #35d889;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255, 106, 0, 0.10),
                    transparent 38%
                ),
                var(--bg);

            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        /* LOGO */

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 54px;
            height: 54px;

            margin: 0 auto 15px;

            border-radius: 14px;

            background: var(--orange);

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;

            font-size: 27px;
            font-weight: 900;

            box-shadow:
                0 10px 35px rgba(255, 106, 0, .20);
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.4px;
        }

        .brand p {
            color: #666;
            font-size: 11px;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1.3px;
        }

        /* CARD */

        .card {
            background: rgba(17, 17, 17, .94);

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, .45);
        }

        .eyebrow {
            color: var(--orange);

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 1.5px;
            text-transform: uppercase;

            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 27px;
            line-height: 1.15;

            letter-spacing: -.8px;

            margin-bottom: 10px;
        }

        .description {
            color: var(--muted);

            font-size: 13px;
            line-height: 1.6;

            margin-bottom: 27px;
        }

        /* INPUT */

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;

            color: #aaa;

            font-size: 11px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #666;

            font-size: 14px;
        }

        input {
            width: 100%;

            height: 49px;

            border: 1px solid #303030;

            border-radius: 9px;

            background: #0b0b0b;

            color: #fff;

            padding: 0 14px 0 40px;

            outline: none;

            font-size: 13px;

            transition: .2s;
        }

        input::placeholder {
            color: #4f4f4f;
        }

        input:focus {
            border-color: var(--orange);

            box-shadow:
                0 0 0 3px rgba(255, 106, 0, .08);
        }

        /* BUTTON */

        .login-button {
            width: 100%;

            height: 49px;

            border: none;

            border-radius: 9px;

            background: var(--orange);

            color: white;

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;

            transition: .2s;

            margin-top: 4px;
        }

        .login-button:hover {
            background: var(--orange-dark);

            transform: translateY(-1px);
        }

        .login-button:disabled {
            opacity: .65;
            cursor: wait;
            transform: none;
        }

        /* MESSAGE */

        .message {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            font-size: 11px;

            line-height: 1.4;

            text-align: center;
        }

        .message.error {
            display: block;

            color: #ff8585;

            background: rgba(255, 50, 50, .08);

            border: 1px solid rgba(255, 50, 50, .16);
        }

        .message.success {
            display: block;

            color: var(--green);

            background: rgba(53, 216, 137, .07);

            border: 1px solid rgba(53, 216, 137, .15);
        }

        /* FOOTER */

        .footer {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 7px;

            color: #555;

            font-size: 10px;

            margin-top: 20px;
        }

        .status {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 8px rgba(53, 216, 137, .6);
        }

        /* MOBILE */

        @media (max-width: 500px) {

            body {
                padding: 18px;
            }

            .card {
                padding: 25px 21px;
            }

            .brand {
                margin-bottom: 25px;
            }

            .card h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGO -->

        <div class="brand">

            <div class="logo">
                H
            </div>

            <h1>
                Hunter Help
            </h1>

            <p>
                Inteligência comercial
            </p>

        </div>


        <!-- LOGIN -->

        <div class="card">

            <div class="eyebrow">
                Área da imobiliária
            </div>

            <h2>
                Bem-vindo de volta.
            </h2>

            <p class="description">
                Acesse sua central de inteligência comercial
                e descubra onde sua imobiliária pode vender mais.
            </p>


            <form id="loginForm">

                <div class="field">

                    <label for="agencyKey">
                        Chave de acesso
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ◆
                        </span>

                        <input
                            id="agencyKey"
                            type="text"
                            placeholder="HUNTER-DEMO-001"
                            autocomplete="off"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Entrar no Hunter Help
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>

        </div>


        <div class="footer">

            <span class="status"></span>

            Sistema operacional

        </div>

    </div>


    <script>

        /*
         * BACKEND OFICIAL DO HUNTER HELP
         */

        const API_URL =
            "https://hunter-help-api.onrender.com";


        /*
         * ELEMENTOS
         */

        const loginForm =
            document.getElementById("loginForm");

        const agencyKey =
            document.getElementById("agencyKey");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        /*
         * MOSTRAR MENSAGEM
         */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        /*
         * LOGIN
         */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const key =
                    agencyKey.value.trim();


                if (!key) {

                    showMessage(
                        "Informe a chave da imobiliária.",
                        "error"
                    );

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Verificando acesso...";

                message.className =
                    "message";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/auth/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    key: key
                                })
                            }
                        );


                    const contentType =
                        response.headers
                            .get("content-type") || "";


                    if (!contentType.includes("application/json")) {

                        throw new Error(
                            "O servidor retornou uma resposta inválida."
                        );

                    }


                    const data =
                        await response.json();


                    if (!response.ok || !data.success) {

                        throw new Error(
                            data.message ||
                            "Chave de acesso inválida."
                        );

                    }


                    /*
                     * SALVA A SESSÃO
                     */

                    localStorage.setItem(
                        "hunter_token",
                        data.token
                    );


                    localStorage.setItem(
                        "hunter_agency",
                        JSON.stringify(data.agency)
                    );


                    showMessage(
                        "Acesso autorizado. Abrindo seu painel...",
                        "success"
                    );


                    loginButton.textContent =
                        "Acesso autorizado";


                    /*
                     * REDIRECIONAMENTO CORRETO
                     *
                     * index.html está na RAIZ
                     * dashboard.html está em /frontend/
                     */

                    setTimeout(function() {

                        window.location.href =
                            "frontend/dashboard.html";

                    }, 500);


                } catch (error) {

                    console.error(error);


                    showMessage(
                        error.message ||
                        "Não foi possível conectar ao servidor.",
                        "error"
                    );


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Entrar no Hunter Help";

                }

            }
        );

    </script>

</body>
</html>
